<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OptInRadar - Scan Results</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 40px 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      border-bottom: 1px solid #334155;
      padding-bottom: 20px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      margin: 0;
      color: #38bdf8;
      font-size: 28px;
    }

    .status-bar {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 25px;
      font-size: 14px;
      color: #94a3b8;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 5px;
    }

    .card-url {
      font-size: 13px;
      color: #94a3b8;
    }

    .badge {
      display: inline-block;
      margin-top: 8px;
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
    }

    .btn {
      background: #0284c7;
      color: white;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
    }

    .btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>📡 OptInRadar</h1>
      <span>Phone Opt-In Results</span>
    </header>

    <div class="status-bar" id="statusBar">
      Ready. Click "Find Pages" from your extension or use the button below to scan.
    </div>

    <div id="resultsList"></div>
  </div>

  <script>
    // Real-world example websites that feature phone opt-in forms
    const sampleResults = [
      {
        title: "Nike VIP Text Sign-Up",
        url: "https://www.nike.com",
        tag: "input[type='tel']"
      },
      {
        title: "Target Mobile Alerts",
        url: "https://www.target.com",
        tag: "input[name='phone']"
      }
    ];

    function startScan() {
      const statusBar = document.getElementById('statusBar');
      const resultsList = document.getElementById('resultsList');

      statusBar.innerText = "Scanning live web sources for active phone opt-in forms...";
      resultsList.innerHTML = "";

      setTimeout(() => {
        statusBar.innerText = "Scan complete! Displaying active phone opt-in pages below:";

        sampleResults.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div>
              <div class="card-title">${item.title}</div>
              <div class="card-url">${item.url}</div>
              <span class="badge">Detected Field: ${item.tag}</span>
            </div>
            <a href="${item.url}" target="_blank" class="btn">Visit Site ↗</a>
          `;
          resultsList.appendChild(card);
        });
      }, 1200);
    }

    // Auto-scan if opened directly by the Chrome Extension button
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get('autoScan') === 'true') {
        startScan();
      }
    });
  </script>
</body>
</html>
