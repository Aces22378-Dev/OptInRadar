<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OptInRadar - Phone Opt-In Finder</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111827;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      width: 100%;
      box-sizing: border-box;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 15px;
    }

    button {
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
      color: white;
    }

    .status-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px 20px;
      margin-bottom: 25px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .results-grid {
      display: grid;
      gap: 16px;
    }

    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .result-url {
      color: var(--text-muted);
      font-size: 14px;
      word-break: break-all;
    }

    .badge {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      border: 1px solid var(--accent);
    }

    .open-btn {
      text-decoration: none;
      background: var(--border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
    }

    .open-btn:hover {
      background: var(--accent);
      color: #0f172a;
    }
  </style>
</head>
<body>

  <header>
    <h1>📡 OptInRadar</h1>
    <span class="badge">Web & Extension Scanner</span>
  </header>

  <div class="container">
    <div class="controls">
      <input type="text" id="searchInput" value='site:.com "enter your phone number" "subscribe"'>
      <button id="scanBtn" onclick="runScan()">Find Pages</button>
    </div>

    <div class="status-panel" id="statusPanel">
      Ready to scan. Click "Find Pages" or trigger scan from your Chrome extension.
    </div>

    <div class="results-grid" id="resultsContainer">
      <!-- Detected sites render here -->
    </div>
  </div>

  <script>
    // Sample matching websites to render
    const mockDatabase = [
      {
        title: "VIP Text Club Signup",
        url: "https://example-brand-store.com/sms-signup",
        detectedTag: "input[type='tel']"
      },
      {
        title: "Exclusive SMS Alerts & Discounts",
        url: "https://example-retailer.com/alerts",
        detectedTag: "input[name='mobile']"
      }
    ];

    function runScan() {
      const status = document.getElementById('statusPanel');
      const container = document.getElementById('resultsContainer');
      const query = document.getElementById('searchInput').value;

      status.innerText = `Scanning search results for: "${query}"...`;
      container.innerHTML = '';

      setTimeout(() => {
        status.innerText = `Scan complete. Displaying matching websites with active phone opt-ins.`;
        
        mockDatabase.forEach(item => {
          const card = document.createElement('div');
          card.className = 'result-card';
          card.innerHTML = `
            <div>
              <div class="result-title">${item.title}</div>
              <div class="result-url">${item.url}</div>
              <span class="badge" style="margin-top: 8px; display: inline-block;">Field: ${item.detectedTag}</span>
            </div>
            <a href="${item.url}" target="_blank" class="open-btn">Visit Website ↗</a>
          `;
          container.appendChild(card);
        });
      }, 1000);
    }

    // Auto-trigger scan if opened via Chrome Extension
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('autoScan') === 'true') {
        document.getElementById('statusPanel').innerText = 'Triggered from Extension... Running scan now.';
        runScan();
      }
    });
  </script>
</body>
</html>
