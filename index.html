<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OptInRadar - Automated Live Scanner</title>
  <style>
    :root {
      --bg: #030712;
      --surface: #0b1329;
      --surface-border: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #64748b;
      --green: #10b981;
    }
    body {
      margin: 0; font-family: system-ui, sans-serif;
      background-color: var(--bg); color: var(--text); padding: 40px 20px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--surface-border); padding-bottom: 20px; margin-bottom: 30px; }
    h1 { margin: 0; color: var(--accent); font-size: 24px; }
    .card { background: var(--surface); border: 1px solid var(--surface-border); border-radius: 10px; padding: 20px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .card-url { font-size: 13px; color: var(--accent); text-decoration: none; }
    .badge { display: inline-block; margin-top: 8px; padding: 3px 10px; background: rgba(16, 185, 129, 0.1); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 12px; font-size: 11px; }
    .btn { background: var(--accent); color: #030712; padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; text-decoration: none; }
    .empty { text-align: center; padding: 40px; color: var(--muted); border: 1px dashed var(--surface-border); border-radius: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📡 OptInRadar</h1>
      <span style="color: var(--green); font-size: 13px;">● Cloud Scanner Active</span>
    </header>
    <div id="resultsContainer">Loading automated scan results...</div>
  </div>

  <script>
    async function loadResults() {
      const container = document.getElementById('resultsContainer');
      try {
        const response = await fetch('results.json?t=' + Date.now());
        const data = await response.json();

        if (!data || data.length === 0) {
          container.innerHTML = `<div class="empty">No opt-in pages found yet. The cloud scanner runs automatically or via your extension trigger.</div>`;
          return;
        }

        container.innerHTML = "";
        data.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div>
              <div class="card-title">${item.title}</div>
              <a href="${item.url}" target="_blank" class="card-url">${item.url} ↗</a><br>
              <span class="badge">✓ Verified Free Opt-In</span>
            </div>
            <a href="${item.url}" target="_blank" class="btn">Visit Page</a>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = `<div class="empty">Awaiting first scan generation...</div>`;
      }
    }

    window.addEventListener('DOMContentLoaded', loadResults);
  </script>
</body>
</html>
