<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OptInRadar - Free Phone Opt-In Finder</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --green: #22c55e;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 40px 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      margin: 0;
      color: var(--accent);
      font-size: 28px;
    }

    .status-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 25px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 5px;
    }

    .card-url {
      font-size: 13px;
      color: var(--text-muted);
      word-break: break-all;
    }

    .badge {
      display: inline-block;
      margin-top: 8px;
      margin-right: 6px;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
    }

    .badge-free {
      background: rgba(34, 197, 94, 0.1);
      color: var(--green);
      border: 1px solid var(--green);
    }

    .btn {
      background: var(--accent);
      color: #0f172a;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      border: none;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--accent-hover);
      color: white;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>📡 OptInRadar</h1>
      <span>Free Opt-In Tracker</span>
    </header>

    <div class="status-bar" id="statusBar">
      Click "Find Pages" from your extension or run a scan to locate free phone opt-in landing pages.
    </div>

    <div id="resultsList"></div>
  </div>

  <script>
    let results = JSON.parse(localStorage.getItem('optin_results')) || [];

    function renderResults() {
      const resultsList = document.getElementById('resultsList');
      const statusBar = document.getElementById('statusBar');

      resultsList.innerHTML = "";

      if (results.length === 0) {
        resultsList.innerHTML = `
          <div style="text-align: center; padding: 40px; color: #94a3b8; background: #1e293b; border: 1px dashed #334155; border-radius: 8px;">
            No verified free opt-in pages saved yet. Run your Python scanner to populate results!
          </div>
        `;
        statusBar.innerText = "Radar ready. Awaiting scan results.";
        return;
      }

      statusBar.innerText = `Found ${results.length} verified free phone opt-in page(s):`;

      results.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <div class="card-title">${item.title}</div>
            <div class="card-url">${item.url}</div>
            <span class="badge badge-free">✓ Free Opt-In Verified</span>
            <span class="badge">Field: ${item.tag || 'input[type="tel"]'}</span>
          </div>
          <a href="${item.url}" target="_blank" class="btn">Visit Page ↗</a>
        `;
        resultsList.appendChild(card);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderResults();
    });
  </script>
</body>
</html>
